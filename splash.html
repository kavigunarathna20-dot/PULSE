<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE - Welcome</title>
    <link rel="stylesheet" href="global.css">
    <meta http-equiv="refresh" content="4;url=Home.html">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1559757175-5700dde675bc?w=1600&q=80') center/cover no-repeat;
            font-family: var(--font-family);
        }
        .splash-container {
            text-align: center;
            background: #fff;
            border-radius: 18px;
            padding: 3rem 4rem;
            max-width: 640px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 77, 0, 0.15);
            border: 1px solid rgba(0, 77, 0, 0.08);
        }
        .splash-container h1 {
            color: #004d00;
            font-size: 4rem;
            margin-bottom: 0.5rem;
            letter-spacing: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .splash-container h1::after { display: none; }
        .mission {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            line-height: 1.7;
            font-family: Georgia, serif;
            font-style: italic;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #e8f5e9;
            border-top-color: #4c9f38;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .countdown {
            color: #666;
            font-size: 1.1rem;
            margin: 1rem 0;
        }
        .countdown span {
            color: #4c9f38;
            font-weight: 700;
            font-size: 1.4rem;
        }
        .skip-btn {
            background: transparent;
            border: 2px solid #4c9f38;
            color: #4c9f38;
            padding: 0.7rem 2.5rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        .skip-btn:hover {
            background: #4c9f38;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(76, 159, 56, 0.35);
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="loader"></div>
        <h1>PULSE</h1>
        <p class="mission">Promoting Universal Long-term Sustainable Health —<br>Inspiring good health and well-being for all, because every heartbeat matters.</p>
        <p class="countdown">Entering site in <span id="timer">4</span>...</p>
        <button class="skip-btn" onclick="skipIntro()">Skip Intro</button>
    </div>
    <script>
        let countdown = 4;
        const timerDisplay = document.getElementById('timer');
        function updateTimer() {
            timerDisplay.textContent = countdown;
            if (countdown <= 0) window.location.href = 'HomePage.html';
            countdown--;
        }
        updateTimer();
        setInterval(updateTimer, 1000);
        function skipIntro() { window.location.href = 'HomePage.html'; }
    </script>
</body>
</html>
