<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pulseLogoTitle">
  <title id="pulseLogoTitle">PULSE logo: a white heartbeat line on a green rounded-square badge</title>

  <!-- Filled rounded-square badge (Option A style — full colour) -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#4c9f38"/>

  <!-- Heartbeat / pulse line, white on the green fill -->
  <path d="M18 60 H38 L48 32 L66 88 L76 60 H102"
        fill="none"
        stroke="#ffffff"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Small blue accent dot at the pulse peak, ties in secondary colour -->
  <circle cx="66" cy="88" r="5.5" fill="#1a7bbf"/>
</svg>
